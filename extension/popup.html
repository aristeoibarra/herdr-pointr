<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pointr</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    width: 280px; margin: 0; padding: 14px;
    background: #1a1a1a; color: #f5f5f5;
    font: 13px/1.5 ui-sans-serif, system-ui, sans-serif;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; }
  header .title { font-size: 13px; font-weight: 700; color: #f5b78f; }
  .health { font-size: 11px; color: #8a8a8a; }
  .health.ok { color: #6ee7a8; }
  .health.err { color: #ff8a8a; }
  p { margin: 12px 0 0; font-size: 12px; color: #9a9a9a; }
  kbd {
    background: #0f0f0f; border: 1px solid #3a3a3a; border-radius: 5px;
    padding: 1px 5px; font: inherit; font-size: 11px; color: #ddd;
  }
</style>
</head>
<body>
  <header>
    <span class="title">pointr</span>
    <span class="health" id="health">checking…</span>
  </header>

  <!-- No settings here on purpose: they live in the widget, on the page, so
       there is one place to look instead of two — and so the bookmarklet and
       the mounted-component paths, which have no popup at all, get them too. -->
  <p>
    Open a <strong>localhost</strong> page and press <kbd>Alt</kbd>+<kbd>C</kbd>,
    or click the button in the corner. Settings are behind the gear in that panel.
  </p>
  <script src="popup.js"></script>
</body>
</html>
