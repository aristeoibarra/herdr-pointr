<svg xmlns="http://www.w3.org/2000/svg" width="940" height="268" aria-label="Browser to bridge to coding agent: the widget posts the selected element to the bridge on port 7331, which maps the dev-server port to the directory it was launched from and sends the prompt to the agent working there." role="img" viewBox="0 0 940 268"><rect width="940" height="268" fill="#141414" rx="14"/><text x="28" y="30" fill="#8a8a8a" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">YOUR BROWSER</text><rect width="256" height="176" x="28" y="44" fill="#1d1d1d" stroke="#2e2e2e" rx="10"/><rect width="256" height="28" x="28" y="44" fill="#232323" rx="10"/><rect width="256" height="10" x="28" y="62" fill="#232323"/><circle cx="45" cy="58" r="3.5" fill="#3d3d3d"/><circle cx="57" cy="58" r="3.5" fill="#3d3d3d"/><circle cx="69" cy="58" r="3.5" fill="#3d3d3d"/><text x="86" y="62" fill="#8a8a8a" font-family="ui-monospace, monospace" font-size="11">localhost:3000</text><rect width="104" height="46" x="44" y="88" fill="#262626" rx="6"/><rect width="108" height="46" x="160" y="88" fill="#262626" rx="6"/><rect width="104" height="56" x="44" y="146" fill="#262626" rx="6"/><rect width="108" height="56" x="160" y="146" fill="#d97757" fill-opacity=".14" stroke="#d97757" stroke-width="2" rx="6"/><text x="214" y="178" fill="#f5b78f" font-family="ui-monospace, monospace" font-size="10.5" text-anchor="middle">&lt;ProfileCard&gt;</text><text x="28" y="240" fill="#c9c9c9" font-family="system-ui, sans-serif" font-size="12">Click what’s wrong. Type or dictate the fix.</text><line x1="296" x2="348" y1="132" y2="132" stroke="#3d3d3d" stroke-width="1.5"/><path fill="#3d3d3d" d="M348 132 l-7 -4 v8 z"/><text x="322" y="122" fill="#777" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">POST</text><text x="322" y="152" fill="#777" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">/send</text><text x="362" y="30" fill="#8a8a8a" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">BRIDGE :7331</text><rect width="216" height="176" x="362" y="44" fill="#1d1d1d" stroke="#2e2e2e" rx="10"/><text x="382" y="76" fill="#f5f5f5" font-family="ui-monospace, monospace" font-size="11.5">:3000</text><text x="382" y="100" fill="#8a8a8a" font-family="ui-monospace, monospace" font-size="11.5">↓ its cwd</text><text x="382" y="124" fill="#f5f5f5" font-family="ui-monospace, monospace" font-size="11.5">~/code/acme</text><text x="382" y="148" fill="#8a8a8a" font-family="ui-monospace, monospace" font-size="11.5">↓ nearest agent</text><text x="382" y="172" fill="#6ee7a8" font-family="ui-monospace, monospace" font-size="11.5">w3:p1</text><line x1="382" x2="558" y1="188" y2="188" stroke="#2a2a2a"/><text x="382" y="206" fill="#777" font-family="system-ui, sans-serif" font-size="10.5">no per-project config</text><line x1="590" x2="636" y1="132" y2="132" stroke="#3d3d3d" stroke-width="1.5"/><path fill="#3d3d3d" d="M636 132 l-7 -4 v8 z"/><text x="613" y="122" fill="#777" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">agent</text><text x="613" y="152" fill="#777" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">prompt</text><text x="650" y="30" fill="#8a8a8a" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">THE AGENT YOU ALREADY HAVE OPEN</text><rect width="274" height="176" x="650" y="44" fill="#1d1d1d" stroke="#2e2e2e" rx="10"/><rect width="274" height="24" x="650" y="44" fill="#232323" rx="10"/><rect width="274" height="10" x="650" y="58" fill="#232323"/><text x="664" y="61" fill="#8a8a8a" font-family="ui-monospace, monospace" font-size="10">acme · claude</text><text x="664" y="90" fill="#d97757" font-family="ui-monospace, monospace" font-size="10">&gt; UI change request from the browser</text><text x="676" y="110" fill="#c9c9c9" font-family="ui-monospace, monospace" font-size="10">&lt;ProfileCard&gt;</text><text x="676" y="128" fill="#8a8a8a" font-family="ui-monospace, monospace" font-size="10">ProfileCard › ProfileGrid › AppShell</text><text x="676" y="146" fill="#8a8a8a" font-family="ui-monospace, monospace" font-size="10">props, styles, box, screenshot</text><text x="676" y="172" fill="#6ee7a8" font-family="ui-monospace, monospace" font-size="10">⏺ Enlarging the avatar…</text><text x="924" y="240" fill="#c9c9c9" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">The session that already has your context loaded.</text></svg>