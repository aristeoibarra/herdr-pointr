# Builds the bridge binary for every commit on main (and every release tag),
# for each supported platform, and attaches it to the `dist` prerelease as
# pointr-<os>-<arch>-<sha>.tar.gz, which scripts/build.sh fetches at install
# time. Named by commit: see the header of scripts/build.sh for why.
name: dist

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

# A tag push and the main push of the same commit upload the same asset name.
concurrency:
  group: dist-${{ github.sha }}

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

      # Static binaries, one per platform; CGO off so they run anywhere.
      - name: Package
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*} arch=${target#*/} out="build/$os-$arch"
            mkdir -p "$out"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "$out/pointr" ./bridge
            tar -czf "pointr-$os-$arch-${GITHUB_SHA}.tar.gz" -C "$out" pointr
          done

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view dist >/dev/null 2>&1; then
            gh release create dist --prerelease --target "$GITHUB_SHA" \
              --title "Prebuilt bundles" \
              --notes "Built by CI, one per commit. Fetched by scripts/build.sh at install time; not meant to be downloaded by hand."
          fi
          gh release upload dist pointr-*-"${GITHUB_SHA}".tar.gz --clobber

      # Keep the newest 80 (20 commits × 4 platforms), plus any commit a
      # release tag points at, so a pinned `--ref vX.Y.Z` install keeps working.
      - name: Prune
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tagged=$(git ls-remote --tags origin 'refs/tags/v*' | cut -f1)
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/dist" \
            --jq '.assets | sort_by(.created_at) | reverse | .[80:] | .[] | "\(.id) \(.name)"' |
          while read -r id name; do
            sha=${name%.tar.gz}
            sha=${sha##*-}
            if printf '%s\n' "$tagged" | grep -qx "$sha"; then continue; fi
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
          done
